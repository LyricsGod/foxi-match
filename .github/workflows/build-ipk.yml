name: Build OpenWrt ipk

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'index.html'
      - 'openwrt/**'
      - '.github/workflows/build-ipk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'openwrt/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 打 tag 时把 ipk 挂到 Release 上

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 读取版本号
        id: ver
        run: |
          v=$(grep -m1 '^Version:' openwrt/control/control | awk '{print $2}')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "版本号: $v"

      - name: 构建 ipk
        run: python3 openwrt/build_ipk.py

      - name: 校验包结构
        run: |
          set -e
          f="ipk/luci-app-catfind_${{ steps.ver.outputs.version }}_all.ipk"
          test -f "$f" || { echo "::error::未生成 $f"; exit 1; }

          echo "--- ar 成员 ---"
          ar t "$f"
          echo "--- data.tar.gz 内容 ---"
          ar p "$f" data.tar.gz | tar tzvf -

          # 必须包含游戏本体和 LuCI 界面，缺一个就是打包漏文件
          ar p "$f" data.tar.gz | tar tzf - | grep -qx './www/catfind/index.html' \
            || { echo "::error::包里缺少 index.html"; exit 1; }
          ar p "$f" data.tar.gz | tar tzf - | grep -qx './usr/lib/lua/luci/model/cbi/catfind.lua' \
            || { echo "::error::包里缺少 LuCI 界面"; exit 1; }

          echo "--- 换行检查（脚本必须是 LF，否则路由器执行失败）---"
          tmp=$(mktemp -d)
          ar p "$f" data.tar.gz | tar xz -C "$tmp"
          bad=0
          for s in etc/init.d/catfind www/catfind/cgi-bin/progress www/cgi-bin/catfind-setlevel; do
            if grep -qU $'\r' "$tmp/$s"; then
              echo "::error::$s 含 CRLF"; bad=1
            fi
          done
          [ "$bad" = "0" ] || exit 1
          echo "换行 OK"
          echo "包大小: $(stat -c%s "$f") 字节"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-catfind_${{ steps.ver.outputs.version }}_all.ipk
          path: ipk/*.ipk
          if-no-files-found: error

      # 只有打 v* tag 时才发 Release，日常 push 不产生 Release
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ipk/*.ipk
          generate_release_notes: true
