name: Build OpenWrt ipk

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'index.html'
      - 'openwrt/**'
      - '.github/workflows/build-ipk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'openwrt/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 打 tag 时把 ipk 挂到 Release 上

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 读取版本号
        id: ver
        run: |
          v=$(grep -m1 '^Version:' openwrt/control/control | awk '{print $2}')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "版本号: $v"

      # build_ipk.py 构建完成后会自检：ar 魔数、必需文件是否齐全、
      # 脚本是否 LF 换行。任一项不过直接非零退出，CI 即标红。
      # 校验用纯标准库实现，不依赖镜像里是否装了 binutils。
      - name: 构建并校验 ipk
        run: python3 openwrt/build_ipk.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-catfind_${{ steps.ver.outputs.version }}_all.ipk
          path: ipk/*.ipk
          if-no-files-found: error

      # 只有打 v* tag 时才发 Release，日常 push 不产生 Release
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ipk/*.ipk
          generate_release_notes: true
