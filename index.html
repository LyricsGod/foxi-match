<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fdf6f2">
<title>佛系趣消消 · 找猫</title>
<style>
  :root{
    --blue:#3d7cf5;
    --blue-d:#2f66d6;
    --orange:#ff9f2e;
    --green:#3fbf5f;
    --ink:#2f2f36;
    --ink2:#84858e;
    --ink3:#b7b8c0;
    --line:#eceef3;
    --gap:2px;
    --card-shadow:0 6px 18px rgba(96,110,142,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
    background:
      repeating-radial-gradient(circle at 50% 38%,
        rgba(0,0,0,0) 0px, rgba(0,0,0,0) 42px,
        rgba(0,0,0,.032) 42px, rgba(0,0,0,.032) 84px),
      radial-gradient(circle at 50% -10%, #f6f9ff 0%, #ffffff 55%);
    background-attachment:fixed;
    display:flex; align-items:center; justify-content:center;
    padding:12px 14px 16px;
    -webkit-user-select:none; user-select:none;
    overflow-x:hidden;
  }
  .app{width:min(440px,100%);display:flex;flex-direction:column;gap:10px}

  /* ---------- 顶栏 ---------- */
  .topbar{
    display:grid;grid-template-columns:1fr auto 1fr;
    align-items:center;gap:8px;padding:0 2px;
  }
  .tb-side{display:flex;align-items:center;gap:7px}
  .tb-side.end{justify-content:flex-end}
  .topbar .roundbtn svg{display:block}
  .roundbtn{
    appearance:none;flex:0 0 auto;
    width:34px;height:34px;border-radius:50%;
    border:none;background:#fff;
    color:var(--ink2);font-size:15px;font-weight:700;font-family:inherit;
    display:grid;place-items:center;cursor:pointer;padding:0;
    box-shadow:var(--card-shadow);
    transition:transform .12s,color .15s;
  }
  .roundbtn:active{transform:scale(.93)}
  .roundbtn.on{color:var(--blue)}
  .leveltitle{
    font-size:19px;font-weight:800;letter-spacing:.5px;
    color:var(--ink);white-space:nowrap;
  }
  .leveltitle b{color:var(--blue);font-size:21px;font-variant-numeric:tabular-nums}

  /* ---------- 状态条 ---------- */
  .statusrow{display:flex;align-items:stretch;gap:7px}
  .statcard{
    flex:1;min-width:0;
    display:flex;align-items:center;justify-content:center;gap:4px;
    background:#fff;border-radius:14px;
    padding:7px 6px;
    box-shadow:var(--card-shadow);
    font-size:10.5px;color:var(--ink2);white-space:nowrap;
    overflow:hidden;
  }
  .statcard b{font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:800}
  .statcard span{font-size:10.5px;color:var(--ink2)}
  .statcard.hearts{gap:1px;flex:0 0 auto;padding:7px 10px}
  .statcard.hearts i{font-style:normal;font-size:12px;line-height:1;transition:transform .2s,opacity .2s}
  .statcard.hearts i.off{opacity:.2;transform:scale(.8);filter:grayscale(1)}

  /* ---------- 规则卡 ---------- */
  .rules{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .rules div{
    background:#fff;border-radius:12px;
    padding:7px 3px 6px;
    text-align:center;
    box-shadow:var(--card-shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    min-height:38px;
  }
  .rules span{font-size:8.5px;line-height:1;color:var(--ink3);letter-spacing:0;white-space:nowrap}
  .rules b{font-size:10.5px;line-height:1;color:var(--ink);font-weight:800;white-space:nowrap}

  /* ---------- 棋盘 ---------- */
  .board-wrap{
    --n:5;
    display:grid;
    grid-template-columns:13px minmax(0,1fr);
    grid-template-rows:minmax(0,1fr) 13px;
    gap:5px;
    padding:9px;
    background:#fff;
    border-radius:24px;
    box-shadow:0 12px 30px rgba(96,110,142,.13), 0 1px 2px rgba(96,110,142,.06);
    position:relative;
  }
  .rowlabels{
    grid-area:1/1;
    display:grid;grid-template-rows:repeat(var(--n),1fr);gap:var(--gap);
  }
  .collabels{
    grid-area:2/2;
    display:grid;grid-template-columns:repeat(var(--n),1fr);gap:var(--gap);
  }
  .rowlabels span,.collabels span{
    display:grid;place-items:center;
    font-size:9.5px;font-weight:600;color:var(--ink3);
    font-variant-numeric:tabular-nums;line-height:1;
  }
  .board{
    --n:5;
    grid-area:1/2;
    display:grid;
    grid-template-columns:repeat(var(--n),1fr);
    gap:var(--gap);
    aspect-ratio:1/1;
    touch-action:none;
    -webkit-touch-callout:none;
    position:relative;
    transition:opacity .18s;
  }
  .board.loading{opacity:.3}

  .cell{
    position:relative;
    border-radius:18%;
    background:
      linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0) 42%),
      var(--c,#e9ecf2);
    box-shadow:
      inset 0 -2px 0 rgba(0,0,0,.055),
      inset 0 1px 0 rgba(255,255,255,.55);
    display:grid;place-items:center;
    cursor:pointer;
    overflow:hidden;
    transition:transform .1s;
  }
  .cell:active{transform:scale(.96)}
  .cell .pet{
    width:84%;height:84%;
    opacity:0;transform:scale(.3);
    pointer-events:none;
    filter:drop-shadow(0 1.5px 2px rgba(70,50,60,.18));
    position:relative;z-index:2;
  }
  .cell.is-cow .pet{animation:petIn .48s cubic-bezier(.22,.9,.3,1.05) both}
  @keyframes petIn{
    0%{opacity:0;transform:scale(.28) translateY(11px) rotate(-17deg)}
    48%{opacity:1;transform:scale(1.17) translateY(-3.5px) rotate(7deg)}
    70%{transform:scale(.94) translateY(1.2px) rotate(-3.5deg)}
    86%{transform:scale(1.04) translateY(-.4px) rotate(1.2deg)}
    100%{opacity:1;transform:scale(1) translateY(0) rotate(0)}
  }
  .cell .xmark{
    position:absolute;inset:0;opacity:0;transition:opacity .13s;
    z-index:1;pointer-events:none;
  }
  .cell .xmark::before,.cell .xmark::after{
    content:"";position:absolute;left:50%;top:50%;
    width:42%;height:7.6%;min-height:2.6px;border-radius:99px;
    background:#fff;
    box-shadow:0 1px 2.5px rgba(70,50,60,.26);
  }
  .cell .xmark::before{transform:translate(-50%,-50%) rotate(45deg)}
  .cell .xmark::after{transform:translate(-50%,-50%) rotate(-45deg)}
  .cell.is-x .xmark{opacity:1;animation:xIn .17s ease-out both}
  @keyframes xIn{
    0%{opacity:0;transform:scale(.45)}
    100%{opacity:1;transform:scale(1)}
  }
  .cell.is-bad{
    background:
      linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0) 42%),
      linear-gradient(rgba(255,74,74,.20), rgba(255,74,74,.20)),
      var(--c,#e9ecf2);
    box-shadow:
      inset 0 0 0 2px rgba(224,66,66,.42),
      inset 0 -2px 0 rgba(0,0,0,.045);
    cursor: default;
  }
  .cell.is-bad:active{transform:none}
  .cell.is-bad .xmark{opacity:1}
  .cell.is-bad .xmark::before,
  .cell.is-bad .xmark::after{
    background:#e04242;
    box-shadow:0 1px 2px rgba(150,30,30,.28);
  }
  .cell.err{
    background:linear-gradient(180deg,#ff9e9e,#ff7a7a) !important;
    animation:shake .38s;
  }
  .cell.err .xmark{opacity:0}
  .cell.hint{animation:pulse 1s ease 2}
  @keyframes shake{
    0%,100%{transform:translate(0,0)}
    18%{transform:translate(-4px,1px)}
    38%{transform:translate(4px,-1px)}
    58%{transform:translate(-3px,1px)}
    78%{transform:translate(3px,0)}
  }
  @keyframes pulse{
    0%,100%{box-shadow:inset 0 0 0 0 rgba(61,124,245,0)}
    50%{box-shadow:inset 0 0 0 4px rgba(61,124,245,.6)}
  }

  /* ---------- 工具条 ---------- */
  .tools{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .tool{
    appearance:none;border:none;
    background:#fff;border-radius:16px;
    padding:8px 2px 7px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10px;color:var(--ink2);cursor:pointer;font-family:inherit;
    box-shadow:var(--card-shadow);
    transition:transform .12s,color .16s,box-shadow .16s,background .16s;
  }
  .tool .ic{font-size:17px;line-height:1;font-style:normal}
  .tool .tx{font-weight:600;letter-spacing:.2px;white-space:nowrap}
  .tool:active{transform:scale(.95)}
  .tool.active{
    background:linear-gradient(180deg,#6ea3ff,#3d7cf5);
    color:#fff;
    box-shadow:0 8px 18px rgba(61,124,245,.35);
  }
  .tool:disabled{opacity:.38;pointer-events:none}
  .tool .badge{
    font-size:9px;background:rgba(61,124,245,.12);color:var(--blue);
    border-radius:99px;padding:0 4px;font-weight:800;
  }
  .tool.active .badge{background:rgba(255,255,255,.28);color:#fff}

  /* ---------- 底栏 ---------- */
  .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
  .switch{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2);cursor:pointer;white-space:nowrap}
  .switch input{display:none}
  .switch .track{
    width:30px;height:17px;border-radius:99px;background:#e2e5ec;
    position:relative;transition:background .18s;flex:0 0 auto;
  }
  .switch .track::after{
    content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;
    border-radius:50%;background:#fff;transition:transform .18s;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
  }
  .switch input:checked + .track{background:var(--blue)}
  .switch input:checked + .track::after{transform:translateX(13px)}

  .ghostbtn{
    appearance:none;border:none;background:none;font-family:inherit;
    font-size:11px;color:var(--ink2);cursor:pointer;padding:5px 8px;border-radius:10px;
  }
  .ghostbtn:active{background:rgba(0,0,0,.04)}
  .ghostbtn.on{color:var(--blue);font-weight:700}

  /* ---------- 推理解释条 ---------- */
  .explain{
    position:fixed;left:50%;top:10px;
    transform:translate(-50%,-14px);
    width:min(420px,92vw);
    background:#fff;border-radius:16px;
    padding:12px 14px 12px 15px;
    border-left:4px solid var(--blue);
    box-shadow:0 14px 38px rgba(70,85,120,.24);
    opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;
    font-size:12.5px;line-height:1.6;color:var(--ink2);
    z-index:75;
  }
  .explain.show{opacity:1;transform:translate(-50%,0)}
  .explain b{color:var(--ink);font-weight:800}
  .explain .tag{
    display:inline-block;font-size:9.5px;font-weight:800;
    color:var(--blue);background:rgba(61,124,245,.1);
    padding:1.5px 7px;border-radius:99px;margin-right:6px;
    vertical-align:1.5px;letter-spacing:.4px;
  }
  .explain .tag.warn{color:#c2410c;background:rgba(249,115,22,.12)}

  /* ---------- 提示条 ---------- */
  .toast{
    position:fixed;left:50%;top:14px;transform:translate(-50%,-16px);
    background:rgba(47,47,54,.94);color:#fff;font-size:12px;
    padding:9px 15px;border-radius:999px;z-index:80;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    max-width:86vw;text-align:center;line-height:1.4;
    box-shadow:0 10px 26px rgba(60,60,80,.28);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- 弹层 ---------- */
  .overlay{
    position:fixed;inset:0;z-index:70;display:none;
    place-items:center;padding:22px;
    background:rgba(47,47,54,.34);
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  }
  .overlay.show{display:grid;animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{
    width:min(330px,100%);
    background:#fff;border-radius:26px;
    padding:24px 20px 18px;text-align:center;
    box-shadow:0 24px 64px rgba(70,80,110,.32);
    animation:pop .3s cubic-bezier(.18,1.4,.5,1);
  }
  @keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
  .modal .emoji{font-size:42px;line-height:1;margin-bottom:6px}
  .modal h2{margin:0 0 4px;font-size:19px;letter-spacing:.3px}
  .modal .sub{font-size:12px;color:var(--ink2);line-height:1.6;margin:0 0 14px}
  .modal .statrow{display:flex;justify-content:center;gap:8px;margin:0 0 16px}
  .modal .statrow div{flex:1;background:#f6f8fc;border-radius:14px;padding:9px 4px}
  .modal .statrow b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
  .modal .statrow span{font-size:10px;color:var(--ink3)}
  .modal .rules2{text-align:left;margin:0 0 16px;padding:0;list-style:none}
  .modal .rules2 li{
    display:flex;gap:8px;font-size:12px;color:var(--ink2);line-height:1.65;
    padding:5px 0;border-bottom:1px dashed var(--line);
  }
  .modal .rules2 li:last-child{border-bottom:none}
  .modal .rules2 li b{color:var(--ink);font-weight:700;flex:0 0 auto}
  .pallist{
    display:flex;flex-direction:column;gap:8px;
    max-height:300px;overflow-y:auto;overscroll-behavior:contain;
    margin:0 0 12px;padding:2px;
  }
  .palcard{
    appearance:none;border:1.5px solid transparent;font-family:inherit;cursor:pointer;
    display:flex;align-items:center;gap:11px;width:100%;
    background:#f8f9fc;border-radius:14px;padding:9px 11px;text-align:left;
    position:relative;transition:background .16s,border-color .16s,transform .12s;
  }
  .palcard:active{transform:scale(.98)}
  .palcard.on{background:rgba(61,124,245,.08);border-color:rgba(61,124,245,.45)}
  .paldots{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5px;flex:0 0 auto}
  .paldots i{width:9.5px;height:9.5px;border-radius:3px;display:block}
  .palinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .palinfo b{font-size:12.5px;color:var(--ink);font-weight:700}
  .palinfo i{font-size:10px;color:var(--ink2);font-style:normal}
  .palcheck{font-size:13px;color:var(--blue);font-weight:800;opacity:0;flex:0 0 auto}
  .palcard.on .palcheck{opacity:1}
  .paldel{
    position:absolute;right:7px;top:5px;width:19px;height:19px;
    border:none;background:rgba(0,0,0,.07);border-radius:50%;
    color:var(--ink2);font-size:11px;line-height:1;cursor:pointer;
    display:grid;place-items:center;padding:0;font-family:inherit;
  }
  .palnew{
    width:100%;padding:11px;border-radius:14px;
    border:1.5px dashed rgba(61,124,245,.4);
    background:rgba(61,124,245,.04);color:var(--blue);
    font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .paledit{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:0 0 12px}
  .paledit label{
    position:relative;aspect-ratio:1/1;border-radius:13px;overflow:hidden;
    cursor:pointer;display:block;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.06);
  }
  .paledit input[type=color]{
    position:absolute;inset:0;width:100%;height:100%;
    border:none;padding:0;background:none;cursor:pointer;display:block;
  }
  .paledit input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  .paledit input[type=color]::-webkit-color-swatch{border:none}
  .palname-in{
    width:100%;padding:11px 13px;border-radius:13px;
    border:1.5px solid var(--line);background:#fbfcfe;
    font-family:inherit;font-size:13px;color:var(--ink);
    margin:0;display:block;
  }
  .palname-in:focus{outline:none;border-color:rgba(61,124,245,.5);background:#fff}

  .sfxtop{
    display:flex;align-items:center;justify-content:space-between;
    background:#f6f8fc;border-radius:14px;padding:10px 12px;margin:0 0 12px;
    font-size:12.5px;color:var(--ink);font-weight:600;
  }
  .sfxlist{display:flex;flex-direction:column;gap:7px;margin:0 0 16px}
  .sfxrow{
    appearance:none;border:1.5px solid transparent;font-family:inherit;cursor:pointer;
    display:flex;align-items:center;gap:10px;width:100%;
    background:#f8f9fc;border-radius:14px;padding:9px 11px;text-align:left;
    transition:background .16s,border-color .16s,transform .12s;
  }
  .sfxrow:active{transform:scale(.98)}
  .sfxrow.on{background:rgba(61,124,245,.08);border-color:rgba(61,124,245,.45)}
  .sfxrow .sfxico{font-size:17px;line-height:1;width:20px;text-align:center;flex:0 0 auto}
  .sfxrow .sfxtxt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
  .sfxrow .sfxtxt b{font-size:12.5px;color:var(--ink);font-weight:700}
  .sfxrow .sfxtxt i{font-size:10.5px;color:var(--ink2);font-style:normal;line-height:1.3}
  .sfxrow .sfxchk{font-size:13px;color:var(--blue);font-weight:800;opacity:0;flex:0 0 auto}
  .sfxrow.on .sfxchk{opacity:1}

  .levelgrid{
    display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
    max-height:236px;overflow-y:auto;overscroll-behavior:contain;
    margin:0 0 16px;padding:2px;
  }
  .lvbtn{
    appearance:none;border:none;font-family:inherit;cursor:pointer;
    aspect-ratio:1/1;border-radius:13px;
    background:#f4f6fa;color:var(--ink2);
    font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;
    display:grid;place-items:center;position:relative;
    transition:transform .12s,background .16s;
  }
  .lvbtn.done{background:rgba(61,124,245,.10);color:var(--blue)}
  .lvbtn.done::after{
    content:"✓";position:absolute;right:5px;top:2px;
    font-size:8px;font-weight:800;opacity:.75;
  }
  .lvbtn.cur{
    background:linear-gradient(180deg,#5a94ff,#3d7cf5);color:#fff;
    box-shadow:0 6px 14px rgba(61,124,245,.32);
  }
  .lvbtn.locked{opacity:.3;cursor:default}
  .lvbtn:active{transform:scale(.94)}

  .btn{
    appearance:none;border:none;font-family:inherit;cursor:pointer;
    width:100%;padding:12px;border-radius:16px;
    font-size:14px;font-weight:800;letter-spacing:.4px;
    transition:transform .12s,box-shadow .16s;
  }
  .btn + .btn{margin-top:8px}
  .btn.primary{
    color:#fff;
    background:linear-gradient(180deg,#5a94ff,#3d7cf5);
    box-shadow:0 10px 22px rgba(61,124,245,.34);
  }
  .btn.soft{background:#f4f6fa;color:var(--ink2)}
  .btn:active{transform:scale(.97)}

  @media (max-height:800px){
    body{padding:8px 12px 10px}
    .app{gap:8px}
    .board-wrap{padding:7px;border-radius:20px}
    .rules div{min-height:34px}
    .leveltitle{font-size:17px}
    .leveltitle b{font-size:19px}
  }
  @media (max-width:380px){
    .leveltitle{font-size:16px}
    .leveltitle b{font-size:18px}
    .statcard{font-size:9.5px;padding:6px 4px}
    .tool{font-size:9px}
    .rules span{font-size:8px}
    .rules b{font-size:9.5px}
    .rules div{min-height:32px}
  }
</style>
</head>
<body>

<!-- 猫咪图案 -->

  <symbol id="cat" viewBox="0 0 100 100">
    <path d="M19 45 L22 9 L48 27 Z" fill="#f0b183" stroke="#ecdcd0" stroke-width="2" stroke-linejoin="round"/>
    <path d="M81 45 L78 9 L52 27 Z" fill="#f0b183" stroke="#ecdcd0" stroke-width="2" stroke-linejoin="round"/>
    <path d="M26 39 L27.5 17 L41 27 Z" fill="#f79cb0"/>
    <path d="M74 39 L72.5 17 L59 27 Z" fill="#f79cb0"/>
    <ellipse cx="50" cy="58" rx="34" ry="30" fill="#ffffff" stroke="#ecdcd0" stroke-width="2"/>
    <path d="M43 33.5 V44" stroke="#f0b183" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M50 31.5 V43" stroke="#f0b183" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M57 33.5 V44" stroke="#f0b183" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M17 61 L4.5 57" stroke="#d3bbaa" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M17 67 L4.5 68.5" stroke="#d3bbaa" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M83 61 L95.5 57" stroke="#d3bbaa" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M83 67 L95.5 68.5" stroke="#d3bbaa" stroke-width="2.4" stroke-linecap="round"/>

<script>
/* =========================================================================
   1. 基础工具
   ========================================================================= */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffledArr(n, rng){
  const a = new Array(n);
  for (let i = 0; i < n; i++) a[i] = i;
  for (let i = n - 1; i > 0; i--){
    const j = (rng() * (i + 1)) | 0;
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* =========================================================================
   2. 关卡生成
   规则：N×N 网格 / 分成 N 个连通色块 / 每行每列每色块各 1 只猫 / 猫不能相邻(含对角)
   做法：先随机造一个合法解 → 随机生长出含解色块 → 用求解器找出“第二解”
         → 定向移动格子把第二解破坏 → 反复直到唯一解
   ========================================================================= */

// 2.1 随机生成一个合法解（每行一只，列不重复，相邻两行列距 ≥2）
function makeSolution(n, rng){
  const cols = new Int8Array(n).fill(-1);
  const used = new Uint8Array(n);
  function rec(r){
    if (r === n) return true;
    const order = shuffledArr(n, rng);
    for (let k = 0; k < n; k++){
      const c = order[k];
      if (used[c]) continue;
      if (r > 0 && Math.abs(c - cols[r - 1]) < 2) continue;
      used[c] = 1; cols[r] = c;
      if (rec(r + 1)) return true;
      used[c] = 0; cols[r] = -1;
    }
    return false;
  }
  return rec(0) ? cols : null;
}

// 2.2 以猫为种子随机生长出 n 个连通色块
function growRegions(n, sol, rng){
  const total = n * n;
  const region = new Int16Array(total).fill(-1);
  for (let r = 0; r < n; r++) region[r * n + sol[r]] = r;
  let left = total - n;
  let guard = total * 40;
  while (left > 0 && guard-- > 0){
    const rid = (rng() * n) | 0;
    const cands = [];
    for (let i = 0; i < total; i++){
      if (region[i] !== -1) continue;
      const r = (i / n) | 0, c = i % n;
      if ((r > 0 && region[i - n] === rid) || (r < n - 1 && region[i + n] === rid) ||
          (c > 0 && region[i - 1] === rid) || (c < n - 1 && region[i + 1] === rid)) cands.push(i);
    }
    if (!cands.length) continue;
    region[cands[(rng() * cands.length) | 0]] = rid; left--;
  }
  if (left > 0) return null;
  return region;
}

// 2.2b 均衡生长：总是让最小的色块先扩张，区域大小均匀、无需求解器
function growBalanced(n, seedSol, rng){
  const total = n * n;
  const region = new Int16Array(total).fill(-1);
  const sizes = new Int16Array(n);
  for (let r = 0; r < n; r++){ region[r * n + seedSol[r]] = r; sizes[r] = 1; }

  let left = total - n;
  let guard = total * 80;
  while (left > 0 && guard-- > 0){
    const order = [];
    for (let g = 0; g < n; g++) order.push(g);
    order.sort((a, b) => sizes[a] - sizes[b]);

    let placed = false;
    for (let k = 0; k < order.length && !placed; k++){
      const g = order[k];
      const cands = [];
      for (let i = 0; i < total; i++){
        if (region[i] !== -1) continue;
        const r = (i / n) | 0, c = i % n;
        if ((r > 0 && region[i - n] === g) || (r < n - 1 && region[i + n] === g) ||
            (c > 0 && region[i - 1] === g) || (c < n - 1 && region[i + 1] === g)) cands.push(i);
      }
      if (!cands.length) continue;
      region[cands[(rng() * cands.length) | 0]] = g;
      sizes[g]++; left--; placed = true;
    }
    if (!placed) return growRegions(n, seedSol, rng);
  }
  return left > 0 ? growRegions(n, seedSol, rng) : region;
}

// 2.3 求解器：最多收集 limit 个解
function collectSolutions(n, region, limit){
  const out = [];
  const usedCol = new Uint8Array(n), usedReg = new Uint8Array(n), place = new Int8Array(n);

  // 预计算：每个色块在每一行占据哪些列（位掩码），让可行性检查从 O(n³) 降到 O(n²)
  const regRow = [];
  for (let g = 0; g < n; g++) regRow.push(new Int32Array(n));
  for (let r = 0; r < n; r++){
    const base = r * n;
    for (let c = 0; c < n; c++){
      const g = region[base + c];
      if (g >= 0 && g < n) regRow[g][r] |= (1 << c);
    }
  }

  let colMask = 0;
  function feasible(start){
    const free = ~colMask;
    for (let g = 0; g < n; g++){
      if (usedReg[g]) continue;
      const rg = regRow[g];
      let ok = false;
      for (let r = start; r < n; r++){
        if (rg[r] & free){ ok = true; break; }
      }
      if (!ok) return false;
    }
    return true;
  }

  function rec(r){
    if (out.length >= limit) return;
    if (r === n){ out.push(Array.from(place)); return; }
    for (let c = 0; c < n; c++){
      if (usedCol[c]) continue;
      if (r > 0 && Math.abs(c - place[r - 1]) < 2) continue;
      const g = region[r * n + c];
      if (usedReg[g]) continue;
      usedCol[c] = 1; usedReg[g] = 1; place[r] = c;
      colMask |= (1 << c);
      if (feasible(r + 1)) rec(r + 1);
      colMask &= ~(1 << c);
      usedCol[c] = 0; usedReg[g] = 0;
      if (out.length >= limit) return;
    }
  }

  rec(0);
  return out;
}

// 2.4 移除某格后色块是否仍连通
function stillConnected(n, region, rid, removed){
  let start = -1, cnt = 0;
  for (let i = 0; i < n * n; i++)
    if (region[i] === rid && i !== removed){ if (start < 0) start = i; cnt++; }
  if (!cnt) return false;
  const seen = new Uint8Array(n * n), q = [start];
  seen[start] = 1;
  let vis = 1;
  while (q.length){
    const i = q.pop(), r = (i / n) | 0, c = i % n;
    if (r > 0 && !seen[i - n] && region[i - n] === rid && i - n !== removed){ seen[i - n] = 1; vis++; q.push(i - n); }
    if (r < n - 1 && !seen[i + n] && region[i + n] === rid && i + n !== removed){ seen[i + n] = 1; vis++; q.push(i + n); }
    if (c > 0 && !seen[i - 1] && region[i - 1] === rid && i - 1 !== removed){ seen[i - 1] = 1; vis++; q.push(i - 1); }
    if (c < n - 1 && !seen[i + 1] && region[i + 1] === rid && i + 1 !== removed){ seen[i + 1] = 1; vis++; q.push(i + 1); }
  }
  return vis === cnt;
}

// 2.5 局部搜索把多解压成唯一解
//     每一步在相邻色块之间搬动一个边界格，用前瞻评估挑“能让解数下降”的走法；
//     解数不再下降就回退，长期停滞就重启。目标函数 = 解的数量（降到 1 即成功）。
function makeUnique(n, seedSol, rng, maxIter, sampleN, deadline, now){
  let region = growRegions(n, seedSol, rng);
  if (!region) return { ok: false, iters: 0 };
  const total = n * n;
  const countSizes = () => {
    const a = new Int16Array(n);
    for (let i = 0; i < total; i++) a[region[i]]++;
    return a;
  };
  let bestRegion = Int16Array.from(region), bestCnt = 99, stall = 0;

  for (let it = 0; it < maxIter; it++){
    if (deadline && now() > deadline) break;
    const sols = collectSolutions(n, region, 3);
    const cnt = sols.length;
    if (cnt === 1) return { ok: true, region, sol: sols[0], iters: it };

    if (cnt === 0 || cnt > bestCnt){
      // 变差了：回退到已知最好状态
      region = Int16Array.from(bestRegion);
      if (++stall > 30){
        const fresh = growRegions(n, seedSol, rng);
        if (fresh){ region = fresh; bestCnt = 99; stall = 0; }
      }
      continue;
    }
    bestCnt = cnt; bestRegion = Int16Array.from(region); stall = 0;

    // 所有“跨色块”的边界格移动
    const sz = countSizes();
    const cands = [];
    for (let i = 0; i < total; i++){
      const r = (i / n) | 0, c = i % n, R = region[i];
      if (r > 0 && region[i - n] !== R) cands.push([i, R, region[i - n]]);
      if (r < n - 1 && region[i + n] !== R) cands.push([i, R, region[i + n]]);
      if (c > 0 && region[i - 1] !== R) cands.push([i, R, region[i - 1]]);
      if (c < n - 1 && region[i + 1] !== R) cands.push([i, R, region[i + 1]]);
    }
    if (!cands.length) return { ok: false, iters: it };
    for (let i = cands.length - 1; i > 0; i--){
      const j = (rng() * (i + 1)) | 0;
      const t = cands[i]; cands[i] = cands[j]; cands[j] = t;
    }

    // 前瞻：抽样评估若干走法，只接受“解数严格下降”的走法
    let bestMove = null, bestC = cnt;
    const k = Math.min(cands.length, sampleN);
    for (let s = 0; s < k; s++){
      const i = cands[s][0], R = cands[s][1], A = cands[s][2];
      if (!stillConnected(n, region, R, i)) continue;
      region[i] = A;
      const c2 = collectSolutions(n, region, 3).length;
      region[i] = R;
      if (c2 > 0 && c2 < bestC){ bestC = c2; bestMove = [i, A]; }
    }
    if (bestMove){
      region[bestMove[0]] = bestMove[1];
    } else {
      // 无严格改进：随机走一步跳出去（这里必须保持随机，任何系统性偏好都会让它原地打转）
      for (let s = 0; s < Math.min(k, 6); s++){
        const c = cands[s];
        if (!stillConnected(n, region, c[1], c[0])) continue;
        region[c[0]] = c[2];
        break;
      }
    }
  }
  return { ok: false, iters: maxIter };
}

// 2.5b 均衡打磨：在保持“唯一解”的前提下把色块面积调匀
function polishBalance(n, region, sol, rng, budgetMs, now){
  const total = n * n;
  const sizes = new Int16Array(n);
  for (let i = 0; i < total; i++) sizes[region[i]]++;
  const t0 = now();
  let guard = 900, fails = 0;
  while (guard-- > 0 && now() - t0 < budgetMs && fails < 60){
    let maxG = 0;
    for (let g = 1; g < n; g++) if (sizes[g] > sizes[maxG]) maxG = g;
    let minG = 0;
    for (let g = 1; g < n; g++) if (sizes[g] < sizes[minG]) minG = g;
    if (sizes[maxG] - sizes[minG] <= 1) break;

    const cands = [];
    for (let i = 0; i < total; i++){
      if (region[i] !== maxG) continue;
      if (sol[(i / n) | 0] === i % n) continue;
      const r = (i / n) | 0, c = i % n;
      const opts = [];
      if (r > 0 && region[i - n] !== maxG) opts.push(region[i - n]);
      if (r < n - 1 && region[i + n] !== maxG) opts.push(region[i + n]);
      if (c > 0 && region[i - 1] !== maxG) opts.push(region[i - 1]);
      if (c < n - 1 && region[i + 1] !== maxG) opts.push(region[i + 1]);
      for (const A of opts) if (sizes[A] < sizes[maxG] - 1) cands.push([i, A]);
    }
    if (!cands.length) break;

    let accepted = false;
    for (let t = 0; t < 14 && !accepted; t++){
      const pick = cands[(rng() * cands.length) | 0];
      const i = pick[0], A = pick[1];
      if (!stillConnected(n, region, maxG, i)) continue;
      region[i] = A;
      if (collectSolutions(n, region, 2).length === 1){
        sizes[maxG]--; sizes[A]++; accepted = true;
      } else {
        region[i] = maxG;
      }
    }
    if (accepted) fails = 0; else fails++;
  }
  return region;
}

// 2.6 纯逻辑（唯一余数法）可解性检测：玩家不用猜就能推完
function solvableByLogic(n, region){
  const st = new Uint8Array(n * n);
  const rowCow = new Int8Array(n).fill(-1);
  const colCow = new Int8Array(n).fill(-1);
  const regCow = new Int8Array(n).fill(-1);
  const kill = i => { if (st[i] === 0) st[i] = 2; };
  function place(r, c){
    st[r * n + c] = 1;
    rowCow[r] = c; colCow[c] = r; regCow[region[r * n + c]] = r;
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++){
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < n && cc >= 0 && cc < n) kill(rr * n + cc);
      }
    for (let cc = 0; cc < n; cc++) kill(r * n + cc);
    for (let rr = 0; rr < n; rr++) kill(rr * n + c);
    for (let i = 0; i < n * n; i++) if (region[i] === region[r * n + c]) kill(i);
  }
  let progress = true;
  while (progress){
    progress = false;
    for (let r = 0; r < n; r++){
      if (rowCow[r] >= 0) continue;
      let cnt = 0, pos = -1;
      for (let c = 0; c < n; c++){
        if (st[r * n + c] === 1){ cnt = -1; break; }
        if (st[r * n + c] === 0){ cnt++; pos = c; }
      }
      if (cnt === 1){ place(r, pos); progress = true; }
    }
    for (let c = 0; c < n; c++){
      if (colCow[c] >= 0) continue;
      let cnt = 0, pos = -1;
      for (let r = 0; r < n; r++) if (st[r * n + c] === 0){ cnt++; pos = r; }
      if (cnt === 1){ place(pos, c); progress = true; }
    }
    for (let g = 0; g < n; g++){
      if (regCow[g] >= 0) continue;
      let cnt = 0, pos = -1;
      for (let i = 0; i < n * n; i++) if (region[i] === g && st[i] === 0){ cnt++; pos = i; }
      if (cnt === 1){ place((pos / n) | 0, pos % n); progress = true; }
    }
  }
  let cows = 0;
  for (let i = 0; i < n * n; i++) if (st[i] === 1) cows++;
  return cows === n;
}

// 2.7 在时间预算内挑选最优关卡：优先“纯逻辑可解”，其次色块最均匀
function buildLevel(n, seed, budgetMs){
  const rng = mulberry32(seed);
  const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
  const budget = budgetMs || 300;
  const deadline = now() + budget;
  let best = null, bestScore = Infinity, bestPure = false, bestDev = Infinity, iter = 0;

  // 12×12：唯一解在这个规模需要更努力地搜，但位运算优化后的求解器能稳定拿到。
  // 循环换种子重试，直到拿到唯一解为止（保证“确保有唯一解”这一硬要求）。
  if (n === 12){
    for (let t = 0; t < 60; t++){
      const seedSol = makeSolution(n, rng);
      if (!seedSol) continue;
      // 单轮限时 900ms：失败就换种子重来，比一轮死磕到 2200 次迭代更快命中
      const r = makeUnique(n, seedSol, rng, 2200, 12, now() + 900, now);
      if (r.ok && r.sol){
        polishBalance(n, r.region, r.sol, rng, 120, now);
        return { n, region: r.region, sol: Array.from(r.sol), pure: false };
      }
    }
    // 理论上到不了这里（60 轮种子都失败的概率可忽略），
    // 万一发生就降级到均衡生长兜底，绝不让关卡卡死。
    const seedSol = makeSolution(n, mulberry32(seed ^ 0x51ed));
    const region = growBalanced(n, seedSol, rng);
    return { n, region, sol: Array.from(seedSol), pure: false };
  }

  do {
    iter++;
    // 每次尝试都很便宜（几毫秒），失败就换一个初始解重来
    let cand = null;
    const sampleN = n <= 8 ? 10 : 6;
    const innerIter = n <= 9 ? 260 : 900;   // 10×10 起单轮多迭代几次，避免空转烧预算
    for (let t = 0; t < 24 && !cand; t++){
      const seedSol = makeSolution(n, rng);
      if (!seedSol) continue;
      const r = makeUnique(n, seedSol, rng, innerIter, sampleN, deadline, now);
      if (r.ok && r.sol) cand = { region: r.region, sol: r.sol };
      if (now() > deadline) break;
    }
    if (!cand) continue;

    // 均衡打磨（吃掉剩余预算，最多 60ms）
    polishBalance(n, cand.region, cand.sol, rng,
      Math.max(6, Math.min(60, deadline - now())), now);

    const sizes = new Array(n).fill(0);
    let dev = 0;
    for (let i = 0; i < n * n; i++) sizes[cand.region[i]]++;
    for (let g = 0; g < n; g++) dev += Math.abs(sizes[g] - n);
    const norm = dev / n;
    const pure = solvableByLogic(n, cand.region);
    const score = (pure ? 0 : 1000) + norm;
    if (score < bestScore){
      bestScore = score; best = cand; bestPure = pure; bestDev = norm;
    }
    if (bestPure && bestDev <= 1.6) break;
  } while (now() < deadline && iter < 40);

  if (!best){
    // 兜底一：放宽时间再搏几次唯一解
    const late = now() + 600;
    for (let t = 0; t < 8 && !best; t++){
      const s = makeSolution(n, rng);
      if (!s) continue;
      const r = makeUnique(n, s, rng, 400, 12, late, now);
      if (r.ok && r.sol) best = { region: r.region, sol: r.sol };
    }
  }
  if (!best){
    // 兜底二：换独立随机源，务必拿到唯一解（多轮 makeUnique 重试）
    const rng2 = mulberry32(seed ^ 0x9e3779b9);
    for (let t = 0; t < 60 && !best; t++){
      const s = makeSolution(n, rng2);
      if (!s) continue;
      const r = makeUnique(n, s, rng2, 2200, 12, now() + 1200, now);
      if (r.ok && r.sol) best = { region: r.region, sol: r.sol };
    }
  }
  if (!best){
    // 兜底三（理论不可达）：仍无唯一解就退化为有解可玩，绝不让关卡卡死
    const rng3 = mulberry32(seed ^ 0x51ed);
    for (let t = 0; t < 20 && !best; t++){
      const s = makeSolution(n, rng3);
      if (!s) continue;
      const reg = growRegions(n, s, rng3);
      if (reg) best = { region: reg, sol: s };
    }
  }
  return { n, region: best.region, sol: Array.from(best.sol), pure: !!bestPure };
}

let PALETTE = BUILTIN_PALETTES[0].colors.slice();
let PALETTE_HUE = [];
let PALETTE_L = [];

function hexToHsl(hex){
  let h = String(hex || '').replace('#', '').trim();
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  if (h.length !== 6) return { h: 0, s: 0, l: 70 };
  const r = parseInt(h.slice(0, 2), 16) / 255;
  const g = parseInt(h.slice(2, 4), 16) / 255;
  const b = parseInt(h.slice(4, 6), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let hh = 0;
  if (d){
    if (mx === r) hh = ((g - b) / d) % 6;
    else if (mx === g) hh = (b - r) / d + 2;
    else hh = (r - g) / d + 4;
    hh *= 60;
    if (hh < 0) hh += 360;
  }
  const l = (mx + mn) / 2;
  const sat = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  return { h: hh, s: sat * 100, l: l * 100 };
}

// 当前生效的色系
function currentPaletteId(){ return save.palette || 'macaron'; }
function currentPaletteColors(){
  const id = currentPaletteId();
  const custom = (save.customPalettes || []).filter(p => p.id === id)[0];
  if (custom && custom.colors && custom.colors.length >= 12) return custom.colors;
  const b = BUILTIN_PALETTES.filter(p => p.id === id)[0];
  return (b || BUILTIN_PALETTES[0]).colors;
}
function applyPalette(colors){
  const cols = (colors || []).slice();
  while (cols.length < 12) cols.push(cols[cols.length - 1] || '#cccccc');
  PALETTE = cols.slice(0, 12);
  const hsl = PALETTE.map(hexToHsl);
  PALETTE_HUE = hsl.map(v => v.h);
  PALETTE_L = hsl.map(v => v.l);
}
applyPalette(BUILTIN_PALETTES[0].colors);

// 颜色相近度：色相距离 + 明度差（1% 明度约等于 4° 色相），避免两片同色系糊在一起
function colorDist(a, b){
  let dh = Math.abs(PALETTE_HUE[a] - PALETTE_HUE[b]);
  dh = Math.min(dh, 360 - dh);
  const dl = Math.abs(PALETTE_L[a] - PALETTE_L[b]);
  return dh + dl * 4;
}

// 邻接感知配色：相邻色块尽量用色相差距大的颜色，避免两片相近的粉糊在一起
function assignPalette(n, region){
  const adj = [];
  for (let i = 0; i < n; i++) adj.push([]);
  for (let r = 0; r < n; r++){
    for (let c = 0; c < n; c++){
      const g = region[r * n + c];
      if (c < n - 1){
        const h = region[r * n + c + 1];
        if (h !== g){ adj[g].push(h); adj[h].push(g); }
      }
      if (r < n - 1){
        const h = region[(r + 1) * n + c];
        if (h !== g){ adj[g].push(h); adj[h].push(g); }
      }
    }
  }
  const order = [];
  for (let i = 0; i < n; i++) order.push(i);
  order.sort((a, b) => adj[b].length - adj[a].length);

  const used = new Array(n).fill(-1);
  const taken = new Set();
  for (const g of order){
    let best = -1, bestScore = -1;
    for (let ci = 0; ci < PALETTE.length; ci++){
      if (taken.has(ci)) continue;
      let minD = 1e9;
      for (const nb of adj[g]){
        if (used[nb] < 0) continue;
        const d = colorDist(ci, used[nb]);
        if (d < minD) minD = d;
      }
      if (minD > bestScore){ bestScore = minD; best = ci; }
    }
    if (best < 0){
      best = 0;
      while (taken.has(best) && best < PALETTE.length - 1) best++;
    }
    used[g] = best;
    taken.add(best);
  }
  return used;
}

   ========================================================================= */
let audioCtx = null;
function tone(freq, dur, type, vol, delay){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol == null ? 0.07 : vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  } catch (e) { /* 忽略 */ }
}

let meowBuf = null, meowLoading = false;

function loadMeow(){
  if (meowBuf || meowLoading) return;
  meowLoading = true;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const raw = atob(MEOW_SRC.split(',')[1]);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    const p = audioCtx.decodeAudioData(bytes.buffer);
    if (p && p.then){
      p.then(ab => { meowBuf = ab; }).catch(() => { meowLoading = false; });
    } else {
      audioCtx.decodeAudioData(bytes.buffer, ab => { meowBuf = ab; }, () => { meowLoading = false; });
    }
  } catch (e) { meowLoading = false; }
}

// 播放真实猫叫；每次随机微调音高，避免连点时听起来像复读
function playMeowSample(){
  if (!meowBuf) return false;
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const src = audioCtx.createBufferSource();
    src.buffer = meowBuf;
    src.playbackRate.value = 0.94 + Math.random() * 0.14;
    const g = audioCtx.createGain();
    g.gain.value = 0.9;
    src.connect(g);
    g.connect(audioCtx.destination);
    src.start();
    return true;
  } catch (e) { return false; }
}

let zhVoice = null, ttsTried = false;

  const score = v => {
    const n = (v.name || '');
    let sc = /zh[-_]?CN/i.test(v.lang) ? 10 : 0;
    for (let i = 0; i < pref.length; i++) if (n.indexOf(pref[i]) >= 0) sc += (pref.length - i);
    return sc;
  };
  zh.sort((x, y) => score(y) - score(x));
  zhVoice = zh[0];
  ttsTried = true;
  // 预热：先静默读一个空格，把语音引擎唤醒，正式触发时才不卡
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.voice = zhVoice;
    u.volume = 0;
    u.rate = 2;
    speechSynthesis.speak(u);
  } catch (e) { /* ignore */ }
}

// 兜底：柔和的“喵呜”（三角波 + 低通 + 温和共振峰，两个音节）
function synthMeow(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;

    const syllable = (start, f0, f1, dur, vol) => {
      const osc = audioCtx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f0, start);
      osc.frequency.exponentialRampToValueAtTime(f1, start + dur);

      const lp = audioCtx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 2400;
      lp.Q.value = 0.7;

      const bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 850;
      bp.Q.value = 1.4;

      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, start);
      g.gain.linearRampToValueAtTime(vol, start + dur * 0.22);
      g.gain.exponentialRampToValueAtTime(0.0005, start + dur);

      osc.connect(lp); lp.connect(bp); bp.connect(g); g.connect(audioCtx.destination);
      osc.start(start); osc.stop(start + dur + 0.03);
    };

    syllable(t0, 555, 790, 0.085, 0.085);          // mi
    syllable(t0 + 0.105, 770, 430, 0.185, 0.085);  // ao
  } catch (e) { /* ignore */ }
}

const SAVE_KEY = 'foxi-quxiaoxiao-v1';
// 每关随机棋盘尺寸：上限随关卡缓慢放开，且不会和上一关重复
function maxSizeForLevel(lv){
  if (lv <= 1) return 5;
  if (lv <= 3) return 6;
  if (lv <= 5) return 7;
  if (lv <= 8) return 8;
  if (lv <= 11) return 9;
  if (lv <= 14) return 10;
  if (lv <= 17) return 11;
  return 12;                     // 最大 12 行（保证唯一解的上限）
}
function nextRandomSize(lv, prev){
  const maxN = maxSizeForLevel(lv);
  const pool = [];
  for (let k = 5; k <= maxN; k++) if (k !== prev) pool.push(k);
  if (!pool.length) pool.push(maxN);
  return pool[(Math.random() * pool.length) | 0];
}

const defaultSave = { level: 1, current: 1, stamp: 0, muted: false, autoMark: false, sfx: 'real', palette: 'macaron', customPalettes: [], dailyDate: '', best: {} };

try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) save = Object.assign(save, JSON.parse(raw));
} catch (e) { /* ignore */ }
function persist(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* ignore */ }
}

/* ---------- 进度同步（部署在路由器上时生效，单文件打开会自动跳过） ---------- */
const PROGRESS_URL = 'cgi-bin/progress';

function pushProgress(){
  try {
    save.stamp = Date.now();
    persist();
    fetch(PROGRESS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        level: save.level || 1,
        current: save.current || 1,
        best: save.best || {},
        stamp: save.stamp
      })
    }).catch(function(){});
  } catch (e) { /* 离线时忽略 */ }
}

function pullProgress(){
  return Promise.resolve()
    .then(function(){
      return fetch(PROGRESS_URL + '?_=' + Date.now(), { cache: 'no-store' });
    })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(srv){
      if (!srv || !srv.stamp) return;
      if (srv.stamp <= (save.stamp || 0)) return;      // 本地更新，不覆盖
      save.level = Math.max(save.level || 1, srv.level || 1);
      save.current = Math.min(srv.current || srv.level || 1, save.level);
      save.stamp = srv.stamp;
      if (srv.best) save.best = Object.assign(save.best || {}, srv.best);
      persist();
    })
    .catch(function(){});
}

function buildBoardDom(){
  applyPalette(currentPaletteColors());

  wrap.style.setProperty('--n', n);

  boardEl.style.setProperty('--n', n);

  const colorOf = assignPalette(n, state.region);
  state.colorOf = colorOf;

  const frag = document.createDocumentFragment();
  const cells = new Array(total);
  for (let r = 0; r < n; r++){
    for (let c = 0; c < n; c++){
      const i = r * n + c;
      const el = document.createElement('div');
      el.className = 'cell';
      el.dataset.i = i;
      el.style.setProperty('--c', PALETTE[colorOf[state.region[i]]]);
      el.innerHTML = '<svg class="pet"><use href="#cat"/></svg><span class="xmark"></span>';
      cells[i] = el;
      frag.appendChild(el);
    }
  }
  boardEl.innerHTML = '';
  boardEl.appendChild(frag);

  let rl = '', cl = '';
  for (let k = 1; k <= n; k++){
    rl += '<span>' + k + '</span>';

function paint(i){
  const el = state.cells[i];

}
function paintAll(){

}

function renderHud(){

function fmtTime(ms){

}

/* =========================================================================
   8. 关卡启动
   ========================================================================= */
function dailySeed(){
  const d = new Date();
  return (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()) ^ 0x5bf03635;
}
function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function startLevel(opts){
  if (state.busy) return;
  state.busy = true;
  hideModal();
  stopTimer();

  // 进入关卡就记下进度：level = 已解锁的最高关，current = 上次所在关
  if (state.mode !== 'daily'){
    save.current = state.level;
    save.level = Math.max(save.level || 1, state.level);
    pushProgress();
  }

  const isDaily = state.mode === 'daily';
  const ds = isDaily ? dailySeed() : 0;
  // 每日挑战：同一天全网同一个尺寸；闯关：每关随机，不与上一关重复
  const n = isDaily ? (7 + ((ds >>> 5) % 3)) : nextRandomSize(state.level, state.n);
  const seed = isDaily ? ds : ((Date.now() ^ (state.level * 2654435761)) >>> 0);

  boardEl.classList.add('loading');
  if (!state.cells.length){
    boardEl.style.setProperty('--n', n);
    boardEl.innerHTML = '';
  }
  toast(isDaily ? '正在生成今日挑战…' : `正在出题 · ${n}×${n}`);

  setTimeout(() => {
    const p = buildLevel(n, seed, n <= 7 ? 220 : n <= 9 ? 340 : n <= 11 ? 620 : 2000);
    state.n = n;
    state.region = p.region;
    state.sol = p.sol;
    state.marks = new Uint8Array(n * n);
    state.lives = state.maxLives;
    state.hints = 3; state.finds = 3;
    state.elapsed = 0;
    state.over = false;

    buildBoardDom();
    paintAll();
    renderHud();
    boardEl.classList.remove('loading');
    startTimer();
    state.busy = false;

    if (state.mode === 'daily') toast(`每日挑战 · ${n}×${n}`);
    else if (state.level <= 1) toast(`第 1 关 · ${n}×${n}｜单击打 ✕，双击放猫`);
    else toast(`第 ${state.level} 关 · ${n}×${n}`);
  }, 40);
}

function restartLevel(){
  if (state.busy) return;
  state.marks = new Uint8Array(state.n * state.n);
  state.lives = state.maxLives;
  state.hints = 3; state.finds = 3;
  state.elapsed = 0;
  state.over = false;
  paintAll();
  renderHud();
  startTimer();
  toast('本关已重开');
}

/* =========================================================================
   9. 规则判定
   ========================================================================= */
// 放猫后把同行/同列/同色块/相邻的格子自动打 ✕（可选，默认关闭）
function autoMarkAround(i){
  const n = state.n, r = (i / n) | 0, c = i % n, g = state.region[i];
  const put = j => { if (state.marks[j] === 0){ state.marks[j] = 2; paint(j); } };
  for (let cc = 0; cc < n; cc++) put(r * n + cc);
  for (let rr = 0; rr < n; rr++) put(rr * n + c);
  for (let j = 0; j < n * n; j++) if (state.region[j] === g) put(j);
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++){
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < n && cc >= 0 && cc < n) put(rr * n + cc);
    }
}

// 检查是否有某一行/列/色块已经被彻底堵死（提示玩家回退，而不是傻等）
function warnIfStuck(){
  if (state.over) return;
  const n = state.n;
  const rowCow = new Uint8Array(n), colCow = new Uint8Array(n), regCow = new Uint8Array(n);
  for (let i = 0; i < state.marks.length; i++){
    if (state.marks[i] !== 1) continue;
    const r = (i / n) | 0, c = i % n;
    rowCow[r] = 1; colCow[c] = 1; regCow[state.region[i]] = 1;
  }
  const rowFree = new Int16Array(n), colFree = new Int16Array(n), regFree = new Int16Array(n);
  for (let i = 0; i < state.marks.length; i++){
    if (state.marks[i] !== 0) continue;            // 已有猫或被标了 ✕
    const r = (i / n) | 0, c = i % n, g = state.region[i];
    if (rowCow[r] || colCow[c] || regCow[g]) continue;
    let adj = false;
    for (let dr = -1; dr <= 1 && !adj; dr++)
      for (let dc = -1; dc <= 1; dc++){
        const rr = r + dr, cc = c + dc;
        if (rr < 0 || rr >= n || cc < 0 || cc >= n) continue;
        if (state.marks[rr * n + cc] === 1){ adj = true; break; }
      }
    if (adj) continue;
    rowFree[r]++; colFree[c]++; regFree[g]++;
  }
  for (let r = 0; r < n; r++) if (!rowCow[r] && rowFree[r] === 0) return toast('⚠️ 第 ' + (r + 1) + ' 行已经无处放猫，擦掉一些 ✕ 再试');
  for (let c = 0; c < n; c++) if (!colCow[c] && colFree[c] === 0) return toast('⚠️ 第 ' + (c + 1) + ' 列已经无处放猫，擦掉一些 ✕ 再试');
  for (let g = 0; g < n; g++) if (!regCow[g] && regFree[g] === 0) return toast('⚠️ 有一个色块已经无处放猫，擦掉一些 ✕ 再试');
}

/* =========================================================================
   10. 交互
   ========================================================================= */

function placeCow(i){
  if (state.over || state.busy) return;
  const n = state.n, r = (i / n) | 0, c = i % n;

  // 已确认的猫 / 已判定错误的位置：都不再响应
  if (state.marks[i] === 1 || state.marks[i] === 3) return;

  // 和标准答案比对：位置不对直接扣命，并把这一格标成红叉永久锁死
  if (state.sol[r] !== c){
    state.marks[i] = 3;
    paint(i);
    loseLife(i, '这里没有小猫');
    return;
  }

  state.marks[i] = 1;
  paint(i);
  if (state.autoMark) autoMarkAround(i);
  renderHud();
  playSfx('meow');
  checkWin();
}

// 单击：在格子上切换 ✕（点已放好的猫则收回）
function toggleMark(i){
  if (state.over || state.busy) return;
  if (state.marks[i] === 1 || state.marks[i] === 3) return;   // 猫 / 红叉都不可改
  state.marks[i] = state.marks[i] === 2 ? 0 : 2;
  paint(i);
  renderHud();
  playSfx('mark');
}

// 拖动笔刷：按下的第一格决定这一笔在做什么
//   从空格开始 → 连续画 ✕；从 ✕ 上开始 → 连续擦除
// 每格在一次拖动里只处理一次，避免指针事件密集时反复闪烁
function brushAt(i){
  if (i < 0 || i >= state.marks.length) return;
  if (state.marks[i] === 1 || state.marks[i] === 3) return;   // 猫和红叉都不动
  if (ptr.touched){ if (ptr.touched.has(i)) return; ptr.touched.add(i); }
  if (ptr.dragMode === 2){
    if (state.marks[i] === 0){ state.marks[i] = 2; paint(i); }
  } else {
    if (state.marks[i] === 2){ state.marks[i] = 0; paint(i); }
  }
}

// 快速拖动时指针事件可能跳跃，用直线补齐中间的格子
function markLine(a, b){
  const n = state.n;
  const ar = (a / n) | 0, ac = a % n, br = (b / n) | 0, bc = b % n;
  const steps = Math.max(Math.abs(br - ar), Math.abs(bc - ac));
  if (steps === 0){ brushAt(b); return; }
  for (let t = 0; t <= steps; t++){
    const r = Math.round(ar + (br - ar) * t / steps);
    const c = Math.round(ac + (bc - ac) * t / steps);
    brushAt(r * n + c);
  }
}

function clearMarks(){
  if (state.over || state.busy || !state.marks) return;
  let any = false;
  for (let i = 0; i < state.marks.length; i++) if (state.marks[i] === 2){ any = true; break; }
  if (!any){ toast('已经没有可清除的 ✕ 了'); return; }
  for (let i = 0; i < state.marks.length; i++){
    if (state.marks[i] === 2){ state.marks[i] = 0; paint(i); }
  }
  renderHud();
  playSfx('tick');
  toast('已清除 ✕ 标记（红色 ✕ 保留）');
}

function loseLife(i, why){
  state.lives--;
  const el = state.cells[i];
  if (el){
    el.classList.add('err');
    setTimeout(() => el.classList.remove('err'), 420);
  }
  playSfx('error');
  if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
  toast('❌ ' + why + '　-1 ❤️');
  renderHud();
  if (state.lives <= 0) gameOver();
}


/* ---- 推理引擎：给“提示”找一条玩家能看懂的结论 ---- */

// ① 直接排除：这一格为什么不可能有猫（依赖已放的猫，结论 100% 可靠）
function findEliminable(){
  const n = state.n, out = [];
  const cows = [];
  for (let i = 0; i < n * n; i++) if (state.marks[i] === 1) cows.push(i);
  if (!cows.length) return out;

  for (let i = 0; i < n * n; i++){
    if (state.marks[i] !== 0) continue;
    const r = (i / n) | 0, c = i % n, g = state.region[i];
    let reason = null, kind = 9;
    for (const j of cows){
      const rr = (j / n) | 0, cc = j % n;
      if (Math.abs(rr - r) <= 1 && Math.abs(cc - c) <= 1){
        reason = '它和第 <b>' + (rr + 1) + '</b> 行的小猫贴在一起（含斜对角），两只猫不能相邻。';
        kind = 0; break;
      }
      if (state.region[j] === g){
        reason = '这个色块里已经有猫了，<b>每个色块只能藏 1 只</b>。';
        kind = 1; break;
      }
      if (cc === c){
        reason = '第 <b>' + (c + 1) + '</b> 列已经有猫了，<b>每列只能有 1 只</b>。';
        kind = 2; break;
      }
      if (rr === r){
        reason = '第 <b>' + (r + 1) + '</b> 行已经有猫了，<b>每行只能有 1 只</b>。';
        kind = 3; break;
      }
    }
    if (reason) out.push({ i, reason, kind });
  }
  // 越难自己发现的越优先讲：相邻 > 色块 > 列 > 行
  out.sort((a, b) => a.kind - b.kind);
  return out;
}

// ② 唯一余数：某行/列/色块只剩一个可放位置
function findNakedSingle(){
  const n = state.n;
  const rowCow = new Uint8Array(n), colCow = new Uint8Array(n), regCow = new Uint8Array(n);
  for (let i = 0; i < n * n; i++){
    if (state.marks[i] !== 1) continue;
    const r = (i / n) | 0, c = i % n;
    rowCow[r] = 1; colCow[c] = 1; regCow[state.region[i]] = 1;
  }
  const rowC = [], colC = [], regC = [];
  for (let k = 0; k < n; k++){ rowC.push([]); colC.push([]); regC.push([]); }

  for (let i = 0; i < n * n; i++){
    if (state.marks[i] !== 0) continue;
    const r = (i / n) | 0, c = i % n, g = state.region[i];
    if (rowCow[r] || colCow[c] || regCow[g]) continue;
    let adj = false;
    for (let dr = -1; dr <= 1 && !adj; dr++)
      for (let dc = -1; dc <= 1; dc++){
        const rr = r + dr, cc = c + dc;
        if (rr < 0 || rr >= n || cc < 0 || cc >= n) continue;
        if (state.marks[rr * n + cc] === 1){ adj = true; break; }
      }
    if (adj) continue;
    rowC[r].push(i); colC[c].push(i); regC[g].push(i);
  }
  for (let r = 0; r < n; r++) if (!rowCow[r] && rowC[r].length === 1)
    return { i: rowC[r][0], type: 'row', idx: r };
  for (let c = 0; c < n; c++) if (!colCow[c] && colC[c].length === 1)
    return { i: colC[c][0], type: 'col', idx: c };
  for (let g = 0; g < n; g++) if (!regCow[g] && regC[g].length === 1)
    return { i: regC[g][0], type: 'reg', idx: g };
  return null;
}

// 把“同一行/列/色块里其余格子为什么都不能放猫”讲清楚
function explainWhyOthers(single){
  const n = state.n, keep = single.i;
  const cows = [];
  for (let i = 0; i < n * n; i++) if (state.marks[i] === 1) cows.push(i);

  const cells = [];
  if (single.type === 'row'){
    for (let c = 0; c < n; c++) cells.push(single.idx * n + c);
  } else if (single.type === 'col'){
    for (let r = 0; r < n; r++) cells.push(r * n + single.idx);
  } else {
    for (let i = 0; i < n * n; i++) if (state.region[i] === single.idx) cells.push(i);
  }

  const cnt = { adj: 0, reg: 0, col: 0, row: 0, marked: 0, bad: 0, other: 0 };
  for (const i of cells){
    if (i === keep) continue;
    if (state.marks[i] === 1) continue;
    const r = (i / n) | 0, c = i % n, g = state.region[i];
    let hit = null;
    for (const j of cows){
      const rr = (j / n) | 0, cc = j % n;
      if (Math.abs(rr - r) <= 1 && Math.abs(cc - c) <= 1){ hit = 'adj'; break; }
      if (state.region[j] === g){ hit = 'reg'; break; }
      if (cc === c){ hit = 'col'; break; }
      if (rr === r){ hit = 'row'; break; }
    }
    if (!hit && state.marks[i] === 3) hit = 'bad';
    if (!hit && state.marks[i] === 2) hit = 'marked';
    cnt[hit || 'other']++;
  }

  const parts = [];
  if (cnt.adj) parts.push(cnt.adj + ' 格和已有的猫相邻');
  if (cnt.reg) parts.push(cnt.reg + ' 格所在的色块已经有猫');
  if (cnt.col) parts.push(cnt.col + ' 格同列已经有猫');
  if (cnt.row) parts.push(cnt.row + ' 格同行已经有猫');
  if (cnt.bad) parts.push(cnt.bad + ' 格试过是错的');
  if (cnt.marked) parts.push(cnt.marked + ' 格被你标了 ✕');
  if (cnt.other) parts.push(cnt.other + ' 格也放不下');

  const where = single.type === 'row' ? '第 <b>' + (single.idx + 1) + '</b> 行'
              : single.type === 'col' ? '第 <b>' + (single.idx + 1) + '</b> 列'
              : '这个色块';
  if (!parts.length) return where + '只剩这一个位置能放猫，所以它<b>必定是猫</b>。';
  return where + '只剩这一个位置能放猫 —— 其余格子都不可能：' + parts.join('、') + '。所以这里<b>必定是猫</b>。';
}

let explainTimer = null;
function explain(html, warn){
  const el = $('#explain');
  el.innerHTML = html;
  el.classList.toggle('show', true);
  el.style.borderLeftColor = warn ? '#f97316' : '';
  clearTimeout(explainTimer);
  explainTimer = setTimeout(() => el.classList.remove('show'), warn ? 4200 : 5200);
}

function flashCell(i){
  const el = state.cells[i];
  if (!el) return;
  el.classList.add('hint');
  setTimeout(() => el.classList.remove('hint'), 2100);
}

/* ---- 找猫：直接告诉你一只猫在哪 ---- */
function findCow(){
  if (state.over || state.busy) return;
  if (state.finds <= 0){ toast('找猫次数已用完'); return; }
  const n = state.n, sol = state.sol;
  const rows = [];
  for (let r = 0; r < n; r++){
    if (state.marks[r * n + sol[r]] !== 1) rows.push(r);
  }
  if (!rows.length){ toast('猫已经都找到了'); return; }

  const r = rows[(Math.random() * rows.length) | 0];
  const i = r * n + sol[r];
  state.marks[i] = 1;
  paint(i);
  if (state.autoMark) autoMarkAround(i);
  state.finds--;
  renderHud();
  playSfx('meow');
  flashCell(i);
  explain('<span class="tag">找猫</span>第 <b>' + (r + 1) + '</b> 行的小猫在这里，已经帮你放好了。');
  checkWin();
  warnIfStuck();
}

/* ---- 提示：找出一个“不可能有猫”的格子，并说明理由 ---- */
function giveHint(){
  if (state.over || state.busy) return;
  if (state.hints <= 0){ toast('提示次数已用完'); return; }
  const n = state.n;

  // ① 优先讲“为什么这格不可能有猫”
  const cands = findEliminable();
  if (cands.length){
    const pick = cands[0];
    state.marks[pick.i] = 2;
    paint(pick.i);
    state.hints--;
    renderHud();
    playSfx('hint');
    flashCell(pick.i);
    explain('<span class="tag">排除</span>这一格不可能有猫：' + pick.reason);
    return;
  }

  // ② 没有可直接排除的，就找“只剩一个位置”的行列/色块
  const single = findNakedSingle();
  if (single){
    const r = (single.i / n) | 0, c = single.i % n;
    if (state.sol[r] !== c){
      // 算出来和答案不符 → 说明玩家自己的 ✕ 标错了
      explain('<span class="tag warn">注意</span>你的 ✕ 标记里有不成立的，才把这里逼到只剩一个位置。先擦掉几个 ✕ 再试试。', true);
      return;
    }
    const text = explainWhyOthers(single);
    state.marks[single.i] = 1;
    paint(single.i);
    if (state.autoMark) autoMarkAround(single.i);
    state.hints--;
    renderHud();
    playSfx('hint');
    flashCell(single.i);
    explain('<span class="tag">必然</span>' + text);
    checkWin();
    warnIfStuck();
    return;
  }

  // ③ 需要反向假设才能推进：直接给一只猫
  const rows = [];
  for (let r2 = 0; r2 < n; r2++) if (state.marks[r2 * n + state.sol[r2]] !== 1) rows.push(r2);
  if (!rows.length){ toast('已经完成啦'); return; }
  const r3 = rows[(Math.random() * rows.length) | 0];
  const i3 = r3 * n + state.sol[r3];
  state.marks[i3] = 1;
  paint(i3);
  if (state.autoMark) autoMarkAround(i3);
  state.hints--;
  renderHud();
  playSfx('hint');
  flashCell(i3);
  explain('<span class="tag">必然</span>这一关要反过来假设才能推进：假设别的格子放猫会撞车，所以第 <b>' + (r3 + 1) + '</b> 行只能在这里。');
  checkWin();
  warnIfStuck();
}

function checkWin(){
  let cows = 0;
  for (let i = 0; i < state.marks.length; i++) if (state.marks[i] === 1) cows++;
  if (cows !== state.n) return;
  state.over = true;
  stopTimer();
  playSfx('win');
  if (navigator.vibrate) { try { navigator.vibrate([20, 40, 20]); } catch (e) {} }

  const t = fmtTime(state.elapsed);
  if (state.mode === 'daily'){
    save.dailyDate = todayKey();
    persist();
    showModal({
      emoji: '🏆',
      title: '今日挑战完成',
      sub: '明天再来挑战新的一题吧',
      stats: [[t, '用时'], [state.n + '×' + state.n, '尺寸'], ['3', '剩余提示']],
      actions: [
        { label: '回到主线', primary: true, fn: () => { state.mode = 'main'; state.level = Math.min(save.current || save.level || 1, save.level || 1); startLevel(); } }
      ]
    });
    return;
  }

  const lv = state.level;
  const key = 'lv' + lv;
  const prevBest = save.best[key];
  if (!prevBest || state.elapsed < prevBest) save.best[key] = state.elapsed;
  // 通关即自动保存：解锁下一关，并记为“上次所在关卡”
  save.level = Math.max(save.level || 1, lv + 1);
  save.current = lv + 1;
  pushProgress();

  showModal({
    emoji: '🎉',
    title: '通关！',
    sub: '下一关会换一个随机大小的棋盘',
    stats: [[t, '本关用时'], [String(state.lives), '剩余生命'], [state.n + '×' + state.n, '棋盘']],
    actions: [
      { label: '下一关', primary: true, fn: () => { state.level = lv + 1; startLevel(); } },
      { label: '重玩本关', soft: true, fn: () => { restartLevel(); } }
    ]
  });
}

}

/* =========================================================================
   12. 事件绑定
   ========================================================================= */
// 单击 / 拖动 = 打 ✕ ；双击 / 长按 / 右键 = 放猫
const ptr = { idx: -1, x0: 0, y0: 0, dragging: false, longFired: false, timer: null, lastIdx: -1, dragMode: 2, touched: null };
let lastTap = { idx: -1, t: 0 };
const TAP_GAP = 260;      // 双击判定窗口
const LONG_MS = 420;      // 长按放猫
const DRAG_PX = 7;        // 拖动死区

function cellFromPoint(x, y){
  const el = document.elementFromPoint(x, y);
  return el && el.closest ? el.closest('.cell') : null;
}

boardEl.addEventListener('pointerdown', e => {
  if (state.over || state.busy || e.button === 2) return;
  const cell = e.target.closest ? e.target.closest('.cell') : null;
  if (!cell) return;
  ptr.idx = +cell.dataset.i;
  ptr.x0 = e.clientX; ptr.y0 = e.clientY;
  ptr.dragging = false; ptr.longFired = false;
  clearTimeout(ptr.timer);
  ptr.timer = setTimeout(() => {
    if (ptr.idx < 0 || ptr.dragging) return;
    ptr.longFired = true;
    placeCow(ptr.idx);
  }, LONG_MS);
});

window.addEventListener('pointermove', e => {
  if (ptr.idx < 0) return;
  const dx = e.clientX - ptr.x0, dy = e.clientY - ptr.y0;
  if (!ptr.dragging){
    if (dx * dx + dy * dy < DRAG_PX * DRAG_PX) return;
    if (state.over || state.busy) return;
    ptr.dragging = true;
    clearTimeout(ptr.timer);
    // 按下那一格决定这一笔是“画叉”还是“擦叉”
    ptr.dragMode = state.marks[ptr.idx] === 2 ? 0 : 2;
    ptr.touched = new Set();
    brushAt(ptr.idx);
    ptr.lastIdx = ptr.idx;
  }
  const cell = cellFromPoint(e.clientX, e.clientY);
  if (cell){
    const to = +cell.dataset.i;
    markLine(ptr.lastIdx >= 0 ? ptr.lastIdx : ptr.idx, to);
    ptr.lastIdx = to;
  }
  if (e.cancelable) e.preventDefault();
}, { passive: false });


window.addEventListener('pointerup', () => {
  clearTimeout(ptr.timer);
  const idx = ptr.idx;
  const wasDrag = ptr.dragging, wasLong = ptr.longFired;
  ptr.idx = -1; ptr.dragging = false; ptr.longFired = false; ptr.lastIdx = -1; ptr.touched = null;
  if (wasDrag) renderHud();   // 拖动标记后要刷新“清标记”按钮的可用状态
  if (idx < 0 || wasDrag || wasLong) return;
  if (state.over || state.busy) return;

  const now = Date.now();

  // 已确定的猫、已判定错误的红叉：点、双击、长按都无效
  if (state.marks[idx] === 1 || state.marks[idx] === 3) return;

  if (lastTap.idx === idx && now - lastTap.t < TAP_GAP){
    lastTap.idx = -1;
    placeCow(idx);            // 双击 → 放猫
  } else {
    toggleMark(idx);          // 单击 → 打 ✕ / 取消 ✕
    lastTap.idx = idx; lastTap.t = now;
  }
});

window.addEventListener('pointercancel', () => {
  clearTimeout(ptr.timer);
  ptr.idx = -1; ptr.dragging = false; ptr.longFired = false; ptr.lastIdx = -1; ptr.touched = null;
});

boardEl.addEventListener('contextmenu', e => {
  e.preventDefault();
  const cell = e.target.closest ? e.target.closest('.cell') : null;
  if (cell) placeCow(+cell.dataset.i);
});

$('#btnClear').onclick = clearMarks;
$('#btnHint').onclick = giveHint;
$('#btnFind').onclick = findCow;
$('#btnRestart').onclick = restartLevel;
$('#btnHelp').onclick = () => showHelp(false);
$('#btnLevels').onclick = showLevels;
$('#btnPalette').onclick = showPaletteMenu;

$('#optAuto').checked = state.autoMark;
$('#optAuto').onchange = e => {
  state.autoMark = e.target.checked;
  save.autoMark = state.autoMark;
  persist();
  toast(state.autoMark ? '放猫后自动打 ✕' : '已关闭自动标记');
};

const soundBtn = $('#btnSound');
function syncSoundBtn(){
  soundBtn.textContent = state.muted ? '🔇' : '🔊';
  soundBtn.title = state.muted ? '音效已关闭' : '音效已开启';
  soundBtn.classList.toggle('on', !state.muted);
}
soundBtn.onclick = showSfxMenu;
syncSoundBtn();

$('#btnDaily').onclick = () => {
  if (state.mode === 'daily'){ toast('已经在每日挑战中'); return; }
  state.mode = 'daily';
  startLevel();
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') hideModal();
  if (e.key === 'h') giveHint();
  if (e.key === 'f') findCow();
  if (e.key === 'r' && !e.ctrlKey && !e.metaKey) restartLevel();
});

/* =========================================================================
   13. 启动
   ========================================================================= */
renderRulebar();
setTimeout(loadMeow, 260);
applyPalette(currentPaletteColors());
// 优先回到“上次所在关卡”，并夹在已解锁范围内
(function boot(){
  let opened = false;

  // 支持 ?level=N 直接跳到指定关卡（LuCI 里也提供这个入口）
  function applyUrlLevel(){
    try {
      const lv = parseInt(new URLSearchParams(location.search).get('level'), 10);
      if (lv && lv > 0){
        save.level = Math.max(save.level || 1, lv);
        save.current = lv;
        save.stamp = Date.now();
        persist();
        pushProgress();
      }
    } catch (e) { /* ignore */ }
  }

  function open(){
    if (opened) return;
    opened = true;
    state.level = Math.min(save.current || save.level || 1, save.level || 1);
    state.mode = 'main';
    startLevel();
  }

  const timer = setTimeout(function(){ applyUrlLevel(); open(); }, 600);   // 路由器没响应也不卡住启动
  pullProgress().then(
    function(){ clearTimeout(timer); applyUrlLevel(); open(); },
    function(){ clearTimeout(timer); applyUrlLevel(); open(); }
  );
})();
</script>
